name: Release Linux (AppImage + deb)

# Runs on this fork only. Not intended for upstream.
# Chains after Main workflow on master (via workflow_run) for rolling latest-linux release.
# Also triggered directly by version tags, e.g.: git tag v1.0.0-linux-beta && git push --tags

on:
  workflow_run:
    workflows: ["Main"]
    types: [completed]
    branches: [master]
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    env:
      DEBUG: electron-builder
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust/Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev cmake liblz4-dev

      - name: Read Node.js version from package.json
        id: node-version
        run: |
          NODE_VERSION=$(node -e "console.log(require('./package.json').engines.node)")
          echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Rebuild native addons for Electron
        run: npx @electron/rebuild -f -v 39.8.0

      # @electron/rebuild doesn't traverse pnpm's isolated store, so it misses loot.
      # Loot's own postinstall fails during pnpm install because libloot.so is built
      # by the root postinstall-libloot.cjs which runs after all package postinstalls.
      # By this step libloot.so exists — rebuild loot explicitly.
      - name: Rebuild loot addon for Electron
        run: |
          LOOT_DIR=$(node -e "process.stdout.write(require('path').dirname(require.resolve('loot/package.json', {paths: ['extensions/gamebryo-plugin-management/node_modules', 'node_modules']})))")
          echo "Rebuilding loot at: $LOOT_DIR"
          cd "$LOOT_DIR"
          npx node-gyp rebuild --target=39.8.0 --arch=x64 --dist-url=https://electronjs.org/headers

      - name: Verify native addons load
        run: node scripts/verify-addons.cjs

      - name: Set package version
        run: |
          BASE_VERSION=$(node -e "const v = require('./package.json').version.split('.'); process.stdout.write(v[0] + '.' + v[1])")
          STAMP=$(date -u +%Y%m%d%H%M)
          echo "VORTEX_VERSION=${BASE_VERSION}.${STAMP}" >> "$GITHUB_ENV"

      - name: Build AppImage and deb
        run: pnpm run package:nosign

      - name: Verify asar-unpacked paths
        run: node scripts/verify-asar-unpacked.cjs

      - name: Rename AppImage to stable filename
        run: mv ./dist/vortex-setup-*.AppImage ./dist/vortex-setup.AppImage

      # On master branch pushes, force-move the rolling latest-linux tag to this commit
      # so the GitHub release always points to the most recent build.
      - name: Update latest-linux tag
        if: github.ref_type == 'branch'
        run: |
          git tag -f latest-linux
          git push --force origin latest-linux

      - name: Create GitHub Release (version tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/vortex-setup*.AppImage
            ./dist/vortex_amd64.deb
            ./dist/latest-linux.yml
          prerelease: false
          draft: false
          make_latest: true
          name: "Linux Beta ${{ github.ref_name }}"
          body: |
            Linux beta release built from the [Vortex Linux port fork](https://github.com/${{ github.repository }}).

            **Installation:**
            - **AppImage** (recommended): Download, `chmod +x`, run. Ubuntu 22.04+ users: `sudo apt install libfuse2` first.
            - **.deb**: `sudo dpkg -i vortex_*_amd64.deb` (Debian/Ubuntu only)

            This is a community port — not an official Nexus Mods release.

      - name: Create GitHub Release (master rolling)
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-linux
          files: |
            ./dist/vortex-setup*.AppImage
            ./dist/vortex_amd64.deb
            ./dist/latest-linux.yml
          prerelease: true
          draft: false
          make_latest: false
          name: "Linux Latest (master)"
          body: |
            Rolling Linux build from the latest master commit on the [Vortex Linux port fork](https://github.com/${{ github.repository }}).

            Built from commit: ${{ github.sha }}

            **Installation:**
            - **AppImage** (recommended): Download, `chmod +x`, run. Ubuntu 22.04+ users: `sudo apt install libfuse2` first.
            - **.deb**: `sudo dpkg -i vortex_*_amd64.deb` (Debian/Ubuntu only)

            This is a community port — not an official Nexus Mods release.
