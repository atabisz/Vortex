name: Rebase Upstream

on:
  schedule:
    # Weekly (Mondays 06:00 UTC): upstream ships a few stable tags a month and the fork syncs
    # about monthly, so daily polling only burned Actions minutes on a fork GitHub throttles.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional upstream ref to target (default: latest release tag)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    if: github.repository == 'atabisz/Vortex'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebase onto upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: bash .github/scripts/rebase-upstream.sh
