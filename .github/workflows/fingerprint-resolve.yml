name: Fingerprints - Manually resolve
on:
  workflow_dispatch:
    inputs:
      fingerprints:
        description: "Fingerprint(s) — comma- or whitespace-separated, 8 hex chars each"
        required: true
      remove:
        description: "Remove the fingerprint(s) from the table instead of adding"
        required: false
        default: false
        type: boolean
      status:
        description: "Status (only used when remove is false)"
        required: true
        default: "fixed"
        type: choice
        options:
          - fixed
          - released
          - ignored
      release_version:
        description: "Release version (required when status is released and remove is false)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sync:
    # Needs upstream's self-hosted runner + ClickHouse secrets; no-op in forks.
    # `runs-on` falls back to ubuntu-latest in forks so GitHub can allocate a
    # runner and evaluate the job-level `if` — otherwise the workflow queues
    # forever waiting for a self-hosted runner that doesn't exist.
    if: github.repository == 'Nexus-Mods/Vortex'
    runs-on: ${{ github.repository == 'Nexus-Mods/Vortex' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/fingerprints
        with:
          mode: resolve
          fingerprints: ${{ inputs.fingerprints }}
          remove: ${{ inputs.remove }}
          status: ${{ inputs.status }}
          release-version: ${{ inputs.release_version }}
          clickhouse-url: ${{ secrets.CLICKHOUSE_URL }}
          clickhouse-user: ${{ secrets.CLICKHOUSE_USER }}
          clickhouse-password: ${{ secrets.CLICKHOUSE_PASSWORD }}
