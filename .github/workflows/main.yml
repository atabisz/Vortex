name: Main

on:
  push:
    branches: [master, rebase/*]
    paths-ignore:
      - ".planning/**"
      - "packaging/**"
      - "*.md"
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install volta, Node.js and Yarn
        uses: volta-cli/action@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Configure node-gyp for VS 2022
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "npm_config_msvs_version=2022" >> $env:GITHUB_ENV
          echo "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV

      # NOTE(erri120): fontconfig required by font-scanner required by theme-switcher
      # cmake and liblz4-dev required for native addon compilation on Linux
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev cmake liblz4-dev zlib1g-dev xvfb

      # Rust toolchain required by libloot 0.29.1 (rewritten in Rust at 0.25+)
      # Must run before "Install dependencies" because postinstall-libloot.cjs
      # builds libloot from source during pnpm install on Linux
      - name: Install Rust toolchain
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust/Cargo artifacts
        if: runner.os == 'Linux'
        uses: Swatinem/rust-cache@v2

      # pnpm 10 ships an embedded node-gyp whose gyp_main.py occasionally lands
      # without an execute bit on fresh runners (hardlink/tarball quirk).
      # Makefile invokes the script directly and fails with:
      #   /bin/sh: 1: .../node-gyp/gyp/gyp_main.py: Permission denied
      # Pre-emptive chmod is idempotent and cheap.
      - name: Fix pnpm-bundled node-gyp script permissions
        if: runner.os == 'Linux'
        run: |
          GYP_MAIN=$(find "$HOME/setup-pnpm" -path '*/node-gyp/gyp/gyp_main.py' -print -quit || true)
          if [ -n "$GYP_MAIN" ]; then
            chmod +x "$GYP_MAIN"
            echo "chmod +x $GYP_MAIN"
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Rebuild native addons for Electron
        if: runner.os == 'Linux'
        run: npx @electron/rebuild -f -v 39.8.0

      # @electron/rebuild doesn't traverse pnpm's isolated store, so it misses addons
      # installed into store-isolated workspaces. Rebuild them explicitly here.
      - name: Rebuild pnpm-isolated native addons for Electron
        if: runner.os == 'Linux'
        run: |
          LOOT_DIR=$(node -e "process.stdout.write(require('path').dirname(require.resolve('loot/package.json', {paths: ['extensions/gamebryo-plugin-management/node_modules', 'node_modules']})))")
          echo "Rebuilding loot at: $LOOT_DIR"
          cd "$LOOT_DIR"
          npx node-gyp rebuild --target=39.8.0 --arch=x64 --dist-url=https://electronjs.org/headers

          BSATK_DIR=$(node -e "process.stdout.write(require('path').dirname(require.resolve('bsatk/package.json', {paths: ['extensions/gamebryo-bsa-support/node_modules', 'node_modules']})))")
          echo "Rebuilding bsatk at: $BSATK_DIR"
          cd "$BSATK_DIR"
          node fetch_bsatk.js
          npx node-gyp rebuild --target=39.8.0 --arch=x64 --dist-url=https://electronjs.org/headers

          FONT_SCANNER_DIR=$(node -e "process.stdout.write(require('path').dirname(require.resolve('font-scanner/package.json', {paths: ['extensions/theme-switcher/node_modules', 'node_modules']})))")
          echo "Rebuilding font-scanner at: $FONT_SCANNER_DIR"
          cd "$FONT_SCANNER_DIR"
          npx node-gyp rebuild --target=39.8.0 --arch=x64 --dist-url=https://electronjs.org/headers

      - name: Verify native addons load
        if: runner.os == 'Linux'
        run: node scripts/verify-addons.cjs

      - name: Cache DuckDB extensions
        uses: actions/cache@v4
        with:
          path: src/main/build/duckdb-extensions
          key: duckdb-ext-${{ runner.os }}-${{ hashFiles('pnpm-workspace.yaml', 'scripts/duckdb-extensions.json') }}

      - name: Build
        run: pnpm run build:all

      - name: Smoke-launch Electron
        if: runner.os == 'Linux'
        run: pnpm run smoke:startup

      - name: Lint
        if: runner.os == 'Linux'
        run: pnpm run lint:ci

      - name: Test
        if: runner.os == 'Linux'
        run: pnpm run test

      - name: Upload API artifacts
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: api-artifacts
          retention-days: 1
          path: |
            etc/vortex.api.md
            packages/vortex-api/lib

  api:
    needs: build
    if: github.repository == 'Nexus-Mods/Vortex' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Download API artifacts
        uses: actions/download-artifact@v8
        with:
          name: api-artifacts

      - name: Install volta, Node.js
        uses: volta-cli/action@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Nexus-Mods
          repositories: vortex-api

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Run update script
        env:
          MAIN_REPO: Nexus-Mods/Vortex
          API_REPO: https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/Nexus-Mods/vortex-api.git
          PUSH_BRANCH: master
        run: node packages/vortex-api/update-repo.mjs
