name: Main

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install volta, Node.js and Yarn
        uses: volta-cli/action@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          cache: true

      - name: Configure node-gyp for VS 2022
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "npm_config_msvs_version=2022" >> $env:GITHUB_ENV
          echo "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV

      # NOTE(erri120): fontconfig required by font-scanner required by theme-switcher
      # cmake and liblz4-dev required for native addon compilation on Linux
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev cmake liblz4-dev zlib1g-dev

      # Rust toolchain required by libloot 0.29.1 (rewritten in Rust at 0.25+)
      # Must run before "Install dependencies" because postinstall-libloot.cjs
      # builds libloot from source during pnpm install on Linux
      - name: Install Rust toolchain
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: pnpm install

      - name: Rebuild native addons for Electron
        if: runner.os == 'Linux'
        run: npx @electron/rebuild -f -v 39.8.0

      # @electron/rebuild doesn't traverse pnpm's isolated store, so it misses loot.
      # Loot's own postinstall fails during pnpm install because libloot.so is built
      # by the root postinstall-libloot.cjs which runs after all package postinstalls.
      # By this step libloot.so exists — rebuild loot explicitly.
      - name: Rebuild loot addon for Electron
        if: runner.os == 'Linux'
        run: |
          LOOT_DIR=$(node -e "process.stdout.write(require('path').dirname(require.resolve('loot/package.json', {paths: ['extensions/gamebryo-plugin-management/node_modules', 'node_modules']})))")
          echo "Rebuilding loot at: $LOOT_DIR"
          cd "$LOOT_DIR"
          npx node-gyp rebuild --target=39.8.0 --arch=x64 --dist-url=https://electronjs.org/headers

      - name: Verify native addons load
        if: runner.os == 'Linux'
        run: node scripts/verify-addons.cjs

      - name: Build
        run: pnpm run build:all

      - name: Lint
        run: pnpm run lint:ci

      - name: Test
        run: pnpm run test


